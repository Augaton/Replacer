name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AUGATONLIB_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Recuperer AugatonLib
        uses: actions/checkout@v7
        with:
          repository: Augaton/AugatonLib
          ref: ${{ env.AUGATONLIB_REF }}
          path: augatonlib

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Compiler
        run: >
          dotnet build plugin/Replacer.csproj -c Release -o out
          -p:CommonProject=${{ github.workspace }}/augatonlib/src/AugatonLib.csproj

      - name: Verifier la sortie
        run: test -f out/Replacer.dll

      - uses: actions/upload-artifact@v7
        with:
          name: Replacer
          path: out/Replacer.dll
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Chercher des secrets
        run: gitleaks git . --redact --no-banner --exit-code 1
