name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publier"
        required: true
      augatonlib_ref:
        description: "Version d'AugatonLib a embarquer"
        required: false
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Recuperer AugatonLib
        uses: actions/checkout@v4
        with:
          repository: Augaton/AugatonLib
          ref: ${{ github.event.inputs.augatonlib_ref || 'main' }}
          path: augatonlib

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler le plugin
        run: >
          dotnet build plugin/Replacer.csproj -c Release -o out
          -p:CommonProject=${{ github.workspace }}/augatonlib/src/AugatonLib.csproj

      - name: Compiler AugatonLib
        run: dotnet build augatonlib/src/AugatonLib.csproj -c Release -o outlib

      - name: Relever la version d'AugatonLib
        id: lib
        run: echo "sha=$(git -C augatonlib rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preparer l'archive
        run: |
          mkdir -p package/Plugins/7777 package/Plugins/dependencies
          cp out/Replacer.dll package/Plugins/7777/
          cp outlib/AugatonLib.dll package/Plugins/dependencies/
          cp plugin/README.md plugin/NOTICE.md package/ 2>/dev/null || true
          cd package && zip -r ../Replacer.zip .

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            Replacer.zip
            out/Replacer.dll
            outlib/AugatonLib.dll
          body: |
            ## Installation

            Extraire `Replacer.zip` dans `.config/EXILED/` : l'archive contient
            deja la bonne arborescence.

            ```
            Plugins/7777/Replacer.dll
            Plugins/dependencies/AugatonLib.dll
            ```

            **AugatonLib est obligatoire.** Elle est incluse dans l'archive
            (version `${{ steps.lib.outputs.sha }}`) et doit etre placee dans
            `Plugins/dependencies/`, jamais dans `Plugins/7777/`.

            Si d'autres plugins de la collection sont installes, garder la
            version d'AugatonLib la plus recente : ils partagent tous la meme.

            ## Dependances externes

            - [HintServiceMeow](https://github.com/MeowServer/HintServiceMeow)
              dans `Plugins/7777/`
